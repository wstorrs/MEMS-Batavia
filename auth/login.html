<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign In | Batavia Vehicle Dashboard</title>
  <style>
    :root {
      --navy:#0f2347;
      --navy-dark:#07162f;
      --orange:#ff671f;
      --white:#fff;
      --muted:#d8e1ef;
      --danger:#ffd2cc;
      --danger-bg:rgba(162,35,25,.35);
    }
    *{box-sizing:border-box}
    body{
      min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;
      background:radial-gradient(circle at top right,rgba(255,103,31,.18),transparent 32rem),
                 linear-gradient(145deg,var(--navy-dark),var(--navy));
      color:var(--white);font-family:Arial,Helvetica,sans-serif
    }
    .shell{
      width:min(470px,100%);overflow:hidden;border:1px solid #ffffff2b;
      border-radius:20px;background:#051126d6;box-shadow:0 28px 90px #0007
    }
    .header{padding:30px 32px 24px;border-bottom:1px solid #ffffff1f;text-align:center}
    .logo{display:block;width:min(220px,75%);max-height:100px;object-fit:contain;margin:0 auto 20px}
    .eyebrow{margin:0;color:var(--orange);font-size:.83rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    h1{margin:8px 0 4px;font-size:clamp(1.6rem,6vw,2.2rem)}
    .subtitle{margin:0;color:var(--muted)}
    form{padding:28px 32px 32px}
    label{display:block;margin-bottom:18px;font-weight:700}
    input{
      width:100%;margin-top:7px;padding:14px 15px;border:2px solid transparent;
      border-radius:10px;background:#fff;color:#101828;font:inherit
    }
    input:focus{outline:3px solid #ffd166;outline-offset:2px}
    button{
      width:100%;min-height:50px;border:0;border-radius:10px;background:var(--orange);
      color:#151515;font:inherit;font-weight:900;cursor:pointer
    }
    button:disabled{cursor:wait;opacity:.7}
    .error{
      display:none;margin:0 0 18px;padding:12px 14px;border:1px solid #ffd2cc66;
      border-radius:9px;background:var(--danger-bg);color:var(--danger);line-height:1.4
    }
    .error.visible{display:block}
    .footer{margin:22px 0 0;color:var(--muted);font-size:.86rem;line-height:1.5;text-align:center}
    .footer a{color:#fff}
    @media(max-width:520px){.header,form{padding-left:22px;padding-right:22px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <img class="logo" src="/logo.png" alt="Mercy Flight">
      <p class="eyebrow">Mercy Flight EMS</p>
      <h1>Batavia Vehicle Dashboard</h1>
      <p class="subtitle">Administrator sign in</p>
    </header>

    <form id="loginForm">
      <div id="errorMessage" class="error" role="alert" aria-live="polite"></div>

      <label>
        Mercy Flight email
        <input id="username" type="email" autocomplete="username" required autofocus>
      </label>

      <label>
        Password
        <input id="password" type="password" autocomplete="current-password" required>
      </label>

      <button id="submitButton" type="submit">Sign In</button>

      <p class="footer">
        Authorized Mercy Flight personnel only.<br>
        <a href="/">Return to the public dashboard</a>
      </p>
    </form>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("errorMessage");
    const submitButton = document.getElementById("submitButton");

    function returnPath() {
      const requested = new URLSearchParams(location.search).get("returnTo");
      if (
        requested &&
        requested.startsWith("/admin") &&
        !requested.startsWith("//")
      ) {
        return requested;
      }
      return "/admin/";
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add("visible");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.classList.remove("visible");
      submitButton.disabled = true;
      submitButton.textContent = "Signing In...";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });

        const result = await response.json().catch(() => null);

        if (!response.ok || !result?.ok) {
          showError(result?.error || "Sign-in could not be completed.");
          return;
        }

        location.replace(returnPath());
      } catch {
        showError("The authentication service could not be reached.");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Sign In";
      }
    });

    fetch("/api/me", {
      credentials: "same-origin",
      cache: "no-store",
    })
      .then((response) => {
        if (response.ok) location.replace(returnPath());
      })
      .catch(() => {});
  </script>
</body>
</html>
